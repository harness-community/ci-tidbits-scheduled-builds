# CI pipeline that a Cron trigger starts on a clock, with no one clicking Run.
#
# Create secret github-pat and connector githubconnector first
# (see connectors/github-connector.yaml). Paste this pipeline and replace
# every # REPLACE: line. At runtime, set repoName to
# harness-community/ci-tidbits-scheduled-builds.
#
# Then add the Cron triggers in .harness/triggers/. Each trigger YAML
# supplies cadence and the branch to clone. The pipeline reads
# <+pipeline.variables.cadence> and <+pipeline.triggerType>.

pipeline:
  name: Scheduled Builds
  identifier: scheduled_builds
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: githubconnector
        # REPLACE at runtime: harness-community/ci-tidbits-scheduled-builds
        repoName: <+input>
        build:
          type: branch
          spec:
            branch: main
  variables:
    - name: cadence
      type: String
      description: Nightly or weekly. Cron triggers set this in inputYaml.
      required: true
      value: <+input>
  stages:
    - stage:
        name: Nightly
        identifier: nightly
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Prove the schedule
                  identifier: prove_the_schedule
                  type: Run
                  spec:
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      set -eu
                      echo "=== how this execution started ==="
                      echo "pipeline.triggerType: <+pipeline.triggerType>"
                      echo "trigger.type:         <+trigger.type>"
                      echo "cadence:              <+pipeline.variables.cadence>"
                      echo "triggeredBy.name:     <+pipeline.triggeredBy.name>"

                      case "<+pipeline.triggerType>" in
                        SCHEDULER_CRON)
                          echo "Started by a Cron trigger. Expected."
                          ;;
                        MANUAL)
                          echo "Started with Run. Use this path to prove the stage is green before you enable a trigger."
                          ;;
                        *)
                          echo "Started by <+pipeline.triggerType>. This tidbit focuses on SCHEDULER_CRON."
                          ;;
                      esac

                      python -m unittest tests.test_main -v
                      python -m app.main
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
